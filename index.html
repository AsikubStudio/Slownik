<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant słowniczek dla Asika</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFF2FF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF2FF;
  --surface: #FFFFFF;
  --ink: #2E1F2E;
  --ink-soft: #6B4E6B;
  --ink-mute: #B69AB6;
  --rose: #C2477F;
  --rose-soft: #F3DFF0;
  --rose-deep: #9E2F66;
  --leaf: #6F8C5C;
  --border: #ECD9EC;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 3rem 1.5rem 5rem;
}

header {
  text-align: center;
  margin-bottom: 1.2rem;
}

.mark {
  display: flex;
  justify-content: center;
  margin-bottom: 1rem;
}

h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-style: italic;
  font-size: clamp(1.9rem, 5vw, 2.5rem);
  margin: 0;
  color: var(--ink);
}

.flower {
  display: flex;
  justify-content: center;
  margin: 1.4rem 0 2rem;
}

.controls {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 1rem 0;
  z-index: 5;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.8rem;
}

.tabs {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.9rem;
}

.tab {
  flex: 1;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.65rem 0.5rem;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.tab:hover { border-color: var(--rose); color: var(--ink); }

.tab-count {
  font-size: 0.75rem;
  opacity: 0.65;
}

.tab.active {
  background: var(--rose);
  border-color: var(--rose);
  color: #FFFFFF;
}

.search-row {
  display: flex;
  gap: 0.5rem;
}

.search-wrap { position: relative; flex: 1; }

#search {
  width: 100%;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  padding: 0.7rem 2.3rem 0.7rem 1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  outline: none;
}

#search::placeholder { color: var(--ink-mute); }
#search:focus { border-color: var(--rose); }

.history-toggle {
  position: absolute;
  right: 0.4rem;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  color: var(--ink-mute);
  cursor: pointer;
  padding: 0.35rem;
  border-radius: 6px;
  display: flex;
}
.history-toggle:hover { color: var(--rose-deep); background: var(--rose-soft); }

.history-dropdown {
  position: absolute;
  top: calc(100% + 0.4rem);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  z-index: 10;
  display: none;
  overflow: hidden;
}
.history-dropdown.open { display: block; }

.history-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.55rem 0.9rem;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  border: none;
  background: none;
  color: var(--ink);
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.history-item:last-of-type { border-bottom: none; }
.history-item:hover { background: var(--rose-soft); }

.history-empty {
  padding: 0.7rem 0.9rem;
  font-size: 0.82rem;
  color: var(--ink-mute);
}

.history-clear {
  display: block;
  width: 100%;
  text-align: center;
  padding: 0.5rem;
  font-size: 0.78rem;
  color: var(--rose-deep);
  background: var(--rose-soft);
  border: none;
  cursor: pointer;
}
.history-clear:hover { background: var(--rose); color: #fff; }

.add-btn {
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.7rem 1rem;
  border: 1px solid var(--rose);
  border-radius: 10px;
  background: transparent;
  color: var(--rose-deep);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}
.add-btn:hover { background: var(--rose); color: #fff; }

.add-panel {
  margin-top: 0.8rem;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  display: none;
  flex-direction: column;
  gap: 0.6rem;
}
.add-panel.open { display: flex; }

.add-panel label {
  font-size: 0.78rem;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.add-panel input,
.add-panel select,
.add-panel textarea {
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  padding: 0.6rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
}
.add-panel input:focus,
.add-panel select:focus,
.add-panel textarea:focus { border-color: var(--rose); }
.add-panel textarea { resize: vertical; min-height: 60px; font-family: 'Inter', sans-serif; }

.add-row { display: flex; gap: 0.6rem; }
.add-row label { flex: 1; }

.add-error {
  font-size: 0.78rem;
  color: var(--rose-deep);
  display: none;
}
.add-error.show { display: block; }

.add-actions { display: flex; gap: 0.6rem; align-items: center; }

.add-submit {
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 500;
  padding: 0.55rem 1.1rem;
  border: none;
  border-radius: 999px;
  background: var(--rose-deep);
  color: #fff;
  cursor: pointer;
}
.add-submit:hover { opacity: 0.9; }

.add-cancel {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  color: var(--ink-soft);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  display: none;
}
.add-cancel.show { display: inline; }

.letter {
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--rose-deep);
  margin: 2rem 0 0.6rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--border);
}

.letter:first-of-type { margin-top: 0; }

.entry {
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 0.6rem;
}

.entry.starred {
  border-left: 3px solid var(--rose-deep);
  padding-left: 0.6rem;
  margin-left: -0.9rem;
}

.tag {
  font-size: 0.7rem;
  color: var(--ink-mute);
  font-style: italic;
}

.entry-main { flex: 1; min-width: 0; }

.entry-head {
  display: flex;
  align-items: baseline;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 0.25rem;
}

.term {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--ink);
}

.alias {
  font-size: 0.82rem;
  color: var(--leaf);
}

.def {
  margin: 0;
  font-size: 0.92rem;
  line-height: 1.65;
  color: var(--ink-soft);
  max-width: 60ch;
}

.entry-actions {
  display: flex;
  gap: 0.3rem;
  align-self: flex-start;
}

.icon-btn {
  border: none;
  background: none;
  color: var(--ink-mute);
  cursor: pointer;
  padding: 0.25rem;
  display: flex;
  align-items: center;
  border-radius: 6px;
  transition: color 0.15s ease, background 0.15s ease;
}
.icon-btn:hover { color: var(--rose-deep); background: var(--rose-soft); }
.icon-btn.confirm { color: #fff; background: var(--rose-deep); }

.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--ink-mute);
  font-size: 0.9rem;
}

.wod-wrap {
  display: flex;
  justify-content: center;
  margin: 0.4rem 0 0.1rem;
}

.wod-btn {
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  font-size: 0.88rem;
  padding: 0.45rem 1.2rem;
  border: 1px solid var(--rose);
  border-radius: 999px;
  background: var(--surface);
  color: var(--rose-deep);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.wod-btn:hover { background: var(--rose); color: #fff; }

.sort-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.7rem;
  font-size: 0.82rem;
}

.sort-label { color: var(--ink-mute); margin-right: 0.2rem; }

.sort-btn {
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.sort-btn:hover { border-color: var(--rose); color: var(--ink); }
.sort-btn.active {
  background: var(--rose-soft);
  border-color: var(--rose);
  color: var(--rose-deep);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  z-index: 50;
}
.modal-overlay.open { display: flex; }

.modal-card {
  position: relative;
  background: var(--surface);
  border-radius: 16px;
  padding: 2rem 1.6rem 1.6rem;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}

.modal-close {
  position: absolute;
  top: 0.8rem;
  right: 0.8rem;
  border: none;
  background: none;
  color: var(--ink-mute);
  cursor: pointer;
  padding: 0.3rem;
  border-radius: 6px;
}
.modal-close:hover { color: var(--rose-deep); background: var(--rose-soft); }

.modal-tag {
  font-size: 0.75rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--rose-deep);
  margin-bottom: 0.5rem;
}

.modal-term {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 1.5rem;
  color: var(--ink);
  margin-bottom: 0.2rem;
}

.modal-alias {
  font-size: 0.9rem;
  color: var(--leaf);
  margin-bottom: 0.8rem;
}

.modal-def {
  font-size: 0.95rem;
  line-height: 1.65;
  color: var(--ink-soft);
  margin: 0;
}

#explainView, #explainEditForm { display: none; }
#explainView.show, #explainEditForm.show { display: block; }

#explainInput {
  width: 100%;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  padding: 0.6rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
  resize: vertical;
  min-height: 80px;
}
#explainInput:focus { border-color: var(--rose); }

.signature {
  text-align: center;
  margin-top: 2.5rem;
  font-size: 1.15rem;
  letter-spacing: 0.5px;
  color: var(--rose-deep);
  opacity: 0.9;
}

@media (max-width: 480px) {
  .page { padding: 2rem 1.1rem 4rem; }
  .search-row { flex-direction: column; }
  .add-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>Quant słowniczek dla Asika</h1>
  </header>

  <div class="wod-wrap">
    <button class="wod-btn" id="wordOfDayBtn">Losowe hasło</button>
  </div>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab active" data-cat="prog" role="tab" aria-selected="true">Programowanie <span class="tab-count" id="countProg"></span></button>
      <button class="tab" data-cat="fin" role="tab" aria-selected="false">Finanse i trading <span class="tab-count" id="countFin"></span></button>
    </div>
    <div class="sort-row">
      <span class="sort-label">Sortuj:</span>
      <button class="sort-btn active" data-sort="alpha">A-Z</button>
      <button class="sort-btn" data-sort="starred">★ Najpierw</button>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Szukaj hasła..." autocomplete="off">
        <button class="history-toggle" id="historyToggle" title="Ostatnio wyszukiwane" aria-label="Ostatnio wyszukiwane">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="history-dropdown" id="historyDropdown"></div>
      </div>
      <button class="add-btn" id="toggleAdd">+ Dodaj hasło</button>
    </div>
    <div class="add-panel" id="addPanel">
      <div class="add-row">
        <label>Hasło
          <input type="text" id="newTerm" placeholder="np. Wolumen">
        </label>
        <label>Nazwa angielska (opcjonalnie)
          <input type="text" id="newAlias" placeholder="np. volume">
        </label>
      </div>
      <label>Kategoria
        <select id="newCat">
          <option value="prog">Programowanie</option>
          <option value="fin">Finanse i trading</option>
        </select>
      </label>
      <label>Definicja
        <textarea id="newDef" placeholder="Krótkie wyjaśnienie hasła..."></textarea>
      </label>
      <span class="add-error" id="addError">Uzupełnij hasło i definicję.</span>
      <div class="add-actions">
        <button class="add-submit" id="submitAdd">Dodaj hasło</button>
        <button class="add-cancel" id="cancelEdit">Anuluj edycję</button>
      </div>
    </div>
  </div>

  <main id="list"></main>

  <div class="signature">°❀⋆.ೃ࿔*:･°❀⋆.ೃ࿔*࿔ೃ.⋆❀°･:࿔ೃ.⋆❀°</div>

</div>

<div class="modal-overlay" id="wodOverlay">
  <div class="modal-card">
    <button class="modal-close" id="wodClose" aria-label="Zamknij">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
    </button>
    <div class="modal-tag" id="wodCat"></div>
    <div class="modal-term" id="wodTerm"></div>
    <div class="modal-alias" id="wodAlias"></div>
    <p class="modal-def" id="wodDef"></p>
  </div>
</div>

<div class="modal-overlay" id="explainOverlay">
  <div class="modal-card">
    <button class="modal-close" id="explainClose" aria-label="Zamknij">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
    </button>
    <div class="modal-tag">Po chłopsku</div>
    <div class="modal-term" id="explainTerm"></div>

    <div id="explainView">
      <p class="modal-def" id="explainText"></p>
      <button class="history-clear" id="explainEditBtn" style="margin-top:1rem;">Edytuj wyjaśnienie</button>
    </div>

    <div id="explainEditForm">
      <textarea id="explainInput" placeholder="Napisz proste wyjaśnienie własnymi słowami, jakbyś tłumaczył znajomemu..."></textarea>
      <button class="add-submit" id="explainSaveBtn" style="margin-top:0.7rem;">Zapisz</button>
    </div>
  </div>
</div>

function uid() {
  return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function seedData() {
  return {
    prog: BASE_DATA.prog.map(e => ({ ...e, id: uid() })),
    fin: BASE_DATA.fin.map(e => ({ ...e, id: uid() })),
  };
}

function saveData(d) {
  try { localStorage.setItem('slowniczek-data-v3', JSON.stringify(d)); } catch (e) {}
}

function persist() {
  saveData(data);
  if (fsDocRef && fsSetDoc) {
    fsSetDoc(fsDocRef, data).catch(() => {});
  }
}

function mergeMissingBaseTerms(existing) {
  let changed = false;
  for (const cat of ['prog', 'fin']) {
    const have = new Set(existing[cat].map(e => e.term.toLowerCase()));
    BASE_DATA[cat].forEach(baseEntry => {
      if (!have.has(baseEntry.term.toLowerCase())) {
        existing[cat].push({ ...baseEntry, id: uid() });
        changed = true;
      }
    });
  }
  return changed;
}

function dedupeStore(store) {
  const result = { prog: [], fin: [] };
  let changed = false;
  for (const cat of ['prog', 'fin']) {
    const seen = new Map();
    (store[cat] || []).forEach(e => {
      const key = e.term.trim().toLowerCase();
      if (!seen.has(key)) {
        seen.set(key, e);
      } else {
        changed = true;
        if (e.starred && !seen.get(key).starred) seen.set(key, e);
      }
    });
    result[cat] = Array.from(seen.values());
  }
  return { store: result, changed };
}

function backfillSimple(existing) {
  let changed = false;
  for (const cat of ['prog', 'fin']) {
    existing[cat].forEach(entry => {
      if (!entry.simple) {
        const baseMatch = BASE_DATA[cat].find(b => b.term.toLowerCase() === entry.term.toLowerCase());
        if (baseMatch && baseMatch.simple) {
          entry.simple = baseMatch.simple;
          changed = true;
        }
      }
    });
  }
  return changed;
}

function loadData() {
  try {
    const raw = localStorage.getItem('slowniczek-data-v3');
    if (raw) {
      const parsed = JSON.parse(raw);
      const mergedNew = mergeMissingBaseTerms(parsed);
      const { store, changed } = dedupeStore(parsed);
      const backfilled = backfillSimple(store);
      if (mergedNew || changed || backfilled) saveData(store);
      return store;
    }
  } catch (e) {}
  const fresh = seedData();
  saveData(fresh);
  return fresh;
}

let data = loadData();
let fsDocRef = null;
let fsSetDoc = null;

function mergeStores(local, remote) {
  const merged = { prog: [], fin: [] };
  for (const cat of ['prog', 'fin']) {
    const byTerm = new Map();
    (remote[cat] || []).forEach(e => byTerm.set(e.term.trim().toLowerCase(), e));
    (local[cat] || []).forEach(e => {
      const key = e.term.trim().toLowerCase();
      if (!byTerm.has(key)) byTerm.set(key, e);
    });
    merged[cat] = Array.from(byTerm.values());
  }
  return merged;
}

async function initFirebaseSync() {
  if (!window.__firebaseSync) return;
  const { docRef, getDoc, setDoc, onSnapshot } = window.__firebaseSync;
  fsDocRef = docRef;
  fsSetDoc = setDoc;

  try {
    const snap = await getDoc(fsDocRef);
    if (snap.exists()) {
      const { store } = dedupeStore(snap.data());
      data = mergeStores(data, store);
      const cleaned = dedupeStore(data);
      data = cleaned.store;
      backfillSimple(data);
    }
    saveData(data);
    await setDoc(fsDocRef, data);
    render();

    onSnapshot(fsDocRef, (s) => {
      if (!s.exists()) return;
      const { store: remote } = dedupeStore(s.data());
      if (JSON.stringify(remote) !== JSON.stringify(data)) {
        data = remote;
        saveData(data);
        render();
      }
    }, () => {});
  } catch (e) {
    fsDocRef = null;
    fsSetDoc = null;
  }
}

function normalize(str) {
  return str.toLowerCase()
    .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l')
    .replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
}

const ICON_STAR_FILLED = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
const ICON_EXPLAIN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.2"/><path d="M12 17h.01"/></svg>';

const CAT_LABEL = { prog: 'prog.', fin: 'fin.' };

function findEntry(id) {
  for (const c of ['prog', 'fin']) {
    const entry = data[c].find(e => e.id === id);
    if (entry) return { entry, cat: c };
  }
  return null;
}

function entryHtml(entry, searching) {
  const aliasHtml = entry.alias ? `<span class="alias">(${entry.alias})</span>` : '';
  const catTagHtml = searching ? `<span class="tag">${CAT_LABEL[entry._cat]}</span>` : '';
  const starIcon = entry.starred ? ICON_STAR_FILLED : ICON_STAR;
  return `
      <div class="entry ${entry.starred ? 'starred' : ''}">
        <div class="entry-main">
          <div class="entry-head">
            <span class="term">${entry.term}</span>
            ${aliasHtml}
            ${catTagHtml}
          </div>
          <p class="def">${entry.def}</p>
        </div>
        <div class="entry-actions">
          <button class="icon-btn explain-btn" data-id="${entry.id}" title="${entry.simple ? 'Zobacz wyjaśnienie po chłopsku' : 'Dodaj wyjaśnienie po chłopsku'}" aria-label="Wytłumacz prościej">${ICON_EXPLAIN}</button>
          <button class="icon-btn star-btn ${entry.starred ? 'confirm' : ''}" data-id="${entry.id}" title="Oznacz jako ważne" aria-label="Oznacz jako ważne">${starIcon}</button>
          <button class="icon-btn edit-btn" data-id="${entry.id}" title="Edytuj hasło" aria-label="Edytuj hasło">${ICON_EDIT}</button>
          <button class="icon-btn delete-btn" data-id="${entry.id}" title="Usuń hasło" aria-label="Usuń hasło">${ICON_DELETE}</button>
        </div>
      </div>`;
}

function letteredHtml(items, searching) {
  let html = '';
  let lastLetter = '';
  items.forEach(entry => {
    const letter = entry.term[0].toUpperCase();
    if (letter !== lastLetter) {
      html += `<div class="letter">${letter}</div>`;
      lastLetter = letter;
    }
    html += entryHtml(entry, searching);
  });
  return html;
}

function updateTabCounts() {
  const cp = document.getElementById('countProg');
  const cf = document.getElementById('countFin');
  if (cp) cp.textContent = `(${data.prog.length})`;
  if (cf) cf.textContent = `(${data.fin.length})`;
}

function render() {
  updateTabCounts();
  const list = document.getElementById('list');
  const q = query.trim();
  const searching = q.length > 0;

  let items;
  if (searching) {
    items = [
      ...data.prog.map(e => ({ ...e, _cat: 'prog' })),
      ...data.fin.map(e => ({ ...e, _cat: 'fin' })),
    ].filter(e => normalize(e.term).includes(normalize(q)) || normalize(e.def).includes(normalize(q)));
  } else {
    items = data[activeCat].slice();
  }
  items.sort((a, b) => a.term.localeCompare(b.term, 'pl'));

  if (items.length === 0) {
    list.innerHTML = '<div class="empty">Brak haseł pasujących do wyszukiwania.</div>';
    return;
  }

  let html = '';
  if (sortMode === 'starred') {
    const starredItems = items.filter(e => e.starred);
    const restItems = items.filter(e => !e.starred);
    if (starredItems.length > 0) {
      html += `<div class="letter">★ Ulubione</div>`;
      starredItems.forEach(entry => { html += entryHtml(entry, searching); });
    }
    html += letteredHtml(restItems, searching);
  } else {
    html = letteredHtml(items, searching);
  }
  list.innerHTML = html;
  bindLetterEgg();

  list.querySelectorAll('.explain-btn').forEach(btn => {
    btn.addEventListener('click', () => explainSimple(btn.dataset.id));
  });

  list.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleStar(btn.dataset.id));
  });

  list.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => startEdit(btn.dataset.id));
  });

  list.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('confirm')) {
        deleteEntry(btn.dataset.id);
      } else {
        btn.classList.add('confirm');
        btn.innerHTML = ICON_CHECK;
        btn.title = 'Kliknij ponownie, aby potwierdzić';
        setTimeout(() => {
          if (btn.isConnected) {
            btn.classList.remove('confirm');
            btn.innerHTML = ICON_DELETE;
            btn.title = 'Usuń hasło';
          }
        }, 2500);
      }
    });
  });
}

function bindLetterEgg() {
  document.querySelectorAll('.letter').forEach(el => {
    if (el.textContent.trim() === 'A' && !el.dataset.eggBound) {
      el.dataset.eggBound = '1';
      el.addEventListener('click', () => {
        if (el.dataset.busy) return;
        el.dataset.busy = '1';
        el.textContent = 'Stopy';
        setTimeout(() => {
          el.textContent = 'A';
          delete el.dataset.busy;
        }, 3000);
      });
    }
  });
}

function toggleStar(id) {
  const found = findEntry(id);
  if (!found) return;
  found.entry.starred = !found.entry.starred;
  persist();
  render();
}

function deleteEntry(id) {
  for (const c of ['prog', 'fin']) {
    data[c] = data[c].filter(e => e.id !== id);
  }
  persist();
  if (editingId === id) exitEdit();
  render();
}

function startEdit(id) {
  const found = findEntry(id);
  if (!found) return;
  const { entry, cat } = found;
  editingId = id;
  document.getElementById('newTerm').value = entry.term;
  document.getElementById('newAlias').value = entry.alias || '';
  document.getElementById('newCat').value = cat;
  document.getElementById('newDef').value = entry.def;
  document.getElementById('addError').classList.remove('show');
  document.getElementById('submitAdd').textContent = 'Zapisz zmiany';
  document.getElementById('cancelEdit').classList.add('show');
  document.getElementById('addPanel').classList.add('open');
  document.getElementById('newTerm').focus();
}

function exitEdit() {
  editingId = null;
  document.getElementById('newTerm').value = '';
  document.getElementById('newAlias').value = '';
  document.getElementById('newDef').value = '';
  document.getElementById('addError').classList.remove('show');
  document.getElementById('submitAdd').textContent = 'Dodaj hasło';
  document.getElementById('cancelEdit').classList.remove('show');
  document.getElementById('addPanel').classList.remove('open');
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortMode = btn.dataset.sort;
    render();
  });
});

function getRandomWord() {
  const all = [
    ...data.prog.map(e => ({ ...e, _cat: 'prog' })),
    ...data.fin.map(e => ({ ...e, _cat: 'fin' })),
  ];
  if (all.length === 0) return null;
  return all[Math.floor(Math.random() * all.length)];
}

const wodOverlay = document.getElementById('wodOverlay');

function openWordOfDay() {
  const word = getRandomWord();
  if (!word) return;
  document.getElementById('wodCat').textContent = word._cat === 'prog' ? 'Programowanie' : 'Finanse i trading';
  document.getElementById('wodTerm').textContent = word.term;
  document.getElementById('wodAlias').textContent = word.alias ? `(${word.alias})` : '';
  document.getElementById('wodDef').textContent = word.def;
  wodOverlay.classList.add('open');
}

function closeWordOfDay() {
  wodOverlay.classList.remove('open');
}

document.getElementById('wordOfDayBtn').addEventListener('click', openWordOfDay);
document.getElementById('wodClose').addEventListener('click', closeWordOfDay);

const explainOverlay = document.getElementById('explainOverlay');
const explainTerm = document.getElementById('explainTerm');
const explainText = document.getElementById('explainText');
const explainView = document.getElementById('explainView');
const explainEditForm = document.getElementById('explainEditForm');
const explainInput = document.getElementById('explainInput');
let currentExplainId = null;

function showExplainView(text) {
  explainText.textContent = text;
  explainView.classList.add('show');
  explainEditForm.classList.remove('show');
}

function showExplainEdit(prefill) {
  explainInput.value = prefill || '';
  explainEditForm.classList.add('show');
  explainView.classList.remove('show');
  explainInput.focus();
}

function explainSimple(id) {
  const found = findEntry(id);
  if (!found) return;
  const { entry } = found;
  currentExplainId = id;
  explainTerm.textContent = entry.term;
  explainOverlay.classList.add('open');

  if (entry.simple) {
    showExplainView(entry.simple);
  } else {
    showExplainEdit('');
  }
}

document.getElementById('explainEditBtn').addEventListener('click', () => {
  const found = findEntry(currentExplainId);
  showExplainEdit(found ? found.entry.simple || '' : '');
});

document.getElementById('explainSaveBtn').addEventListener('click', () => {
  const found = findEntry(currentExplainId);
  if (!found) return;
  const val = explainInput.value.trim();
  if (val) {
    found.entry.simple = val;
  } else {
    delete found.entry.simple;
  }
  persist();
  render();
  if (val) {
    showExplainView(val);
  } else {
    explainOverlay.classList.remove('open');
  }
});

document.getElementById('explainClose').addEventListener('click', () => {
  explainOverlay.classList.remove('open');
});
explainOverlay.addEventListener('click', (e) => {
  if (e.target === explainOverlay) explainOverlay.classList.remove('open');
});
wodOverlay.addEventListener('click', (e) => {
  if (e.target === wodOverlay) closeWordOfDay();
});

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    activeCat = btn.dataset.cat;
    document.getElementById('newCat').value = activeCat;
    try { localStorage.setItem('slowniczek-cat', activeCat); } catch (e) {}
    if (editingId) exitEdit();
    render();
  });
});

const searchInput = document.getElementById('search');
const historyDropdown = document.getElementById('historyDropdown');
const historyToggle = document.getElementById('historyToggle');

function loadSearchHistory() {
  try {
    return JSON.parse(localStorage.getItem('slowniczek-search-history') || '[]');
  } catch (e) { return []; }
}

function saveSearchHistory(list) {
  try { localStorage.setItem('slowniczek-search-history', JSON.stringify(list)); } catch (e) {}
}

function addToSearchHistory(term) {
  const trimmed = term.trim();
  if (!trimmed) return;
  let list = loadSearchHistory();
  list = list.filter(t => t.toLowerCase() !== trimmed.toLowerCase());
  list.unshift(trimmed);
  if (list.length > 10) list = list.slice(0, 10);
  saveSearchHistory(list);
}

function renderHistoryDropdown() {
  const list = loadSearchHistory();
  if (list.length === 0) {
    historyDropdown.innerHTML = '<div class="history-empty">Brak ostatnich wyszukiwań.</div>';
    return;
  }
  let html = list.map(term => `<button class="history-item" data-term="${term.replace(/"/g, '&quot;')}">${term}</button>`).join('');
  html += '<button class="history-clear" id="historyClear">Wyczyść historię</button>';
  historyDropdown.innerHTML = html;

  historyDropdown.querySelectorAll('.history-item').forEach(btn => {
    btn.addEventListener('click', () => {
      searchInput.value = btn.dataset.term;
      query = btn.dataset.term;
      render();
      closeHistoryDropdown();
    });
  });

  const clearBtn = document.getElementById('historyClear');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      saveSearchHistory([]);
      renderHistoryDropdown();
    });
  }
}

function openHistoryDropdown() {
  renderHistoryDropdown();
  historyDropdown.classList.add('open');
}

function closeHistoryDropdown() {
  historyDropdown.classList.remove('open');
}

historyToggle.addEventListener('click', () => {
  if (historyDropdown.classList.contains('open')) {
    closeHistoryDropdown();
  } else {
    openHistoryDropdown();
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) closeHistoryDropdown();
});

searchInput.addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && query.trim()) {
    addToSearchHistory(query.trim());
  }
});

searchInput.addEventListener('blur', () => {
  if (query.trim()) addToSearchHistory(query.trim());
});

const toggleAdd = document.getElementById('toggleAdd');
const addPanel = document.getElementById('addPanel');
toggleAdd.addEventListener('click', () => {
  if (editingId) { exitEdit(); return; }
  addPanel.classList.toggle('open');
});

document.getElementById('cancelEdit').addEventListener('click', exitEdit);

document.getElementById('submitAdd').addEventListener('click', () => {
  const term = document.getElementById('newTerm').value.trim();
  const alias = document.getElementById('newAlias').value.trim();
  const cat = document.getElementById('newCat').value;
  const def = document.getElementById('newDef').value.trim();
  const errorEl = document.getElementById('addError');

  if (!term || !def) {
    errorEl.classList.add('show');
    return;
  }
  errorEl.classList.remove('show');

  if (editingId) {
    for (const c of ['prog', 'fin']) {
      data[c] = data[c].filter(e => e.id !== editingId);
    }
    const editedEntry = { id: editingId, term, def };
    if (alias) editedEntry.alias = alias;
    data[cat].push(editedEntry);
  } else {
    const newEntry = { id: uid(), term, def };
    if (alias) newEntry.alias = alias;
    data[cat].push(newEntry);
  }
  persist();

  exitEdit();

  if (cat !== activeCat) {
    document.querySelectorAll('.tab').forEach(b => {
      const isActive = b.dataset.cat === cat;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', String(isActive));
    });
    activeCat = cat;
  }
  render();
});

try {
  const saved = localStorage.getItem('slowniczek-cat');
  if (saved && data[saved]) {
    activeCat = saved;
    document.querySelectorAll('.tab').forEach(b => {
      const isActive = b.dataset.cat === saved;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', String(isActive));
    });
    document.getElementById('newCat').value = saved;
  }
} catch (e) {}

render();
initFirebaseSync();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
